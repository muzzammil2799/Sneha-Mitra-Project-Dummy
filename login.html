<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SNEHA MITRA — DEMO VERSION</title>
  <link rel="stylesheet" href="static/css/forms.css">
  <link rel="stylesheet" href="static/css/login.css">
  <style>
    #login { flex-direction: column; gap: 14px; }
    .demo-hero {
      width: 100%;
      max-width: 400px;
      background: linear-gradient(135deg, #2C3E50, #1A252F);
      color: #FFFFFF;
      border: 2px solid #F59E0B;
      border-radius: 16px;
      padding: 14px 18px;
      text-align: center;
      box-shadow: 0 6px 18px rgba(44, 62, 80, 0.18);
    }
    .demo-hero-tag {
      display: inline-block;
      background: #D32F2F;
      color: #FFFFFF;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.14em;
      padding: 3px 10px;
      border-radius: 999px;
      margin-bottom: 6px;
    }
    .demo-hero-title {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 0.1em;
      line-height: 1.15;
      color: #FEF08A;
      margin: 0;
    }
    .demo-hero-sub {
      font-size: 12px;
      font-weight: 600;
      color: #E2E8F0;
      margin: 4px 0 0;
    }
    .brand-demo-pill {
      display: inline-block;
      margin: 0 auto 6px;
      background: #FFFBEB;
      color: #B45309;
      border: 1px solid #F59E0B;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.1em;
      padding: 2px 10px;
      border-radius: 999px;
    }
    .brand-wrap { text-align: center; }
    .demo-helper {
      width: 100%;
      max-width: 400px;
      background: #FFFFFF;
      border: 1px solid #E0E6ED;
      border-radius: 14px;
      padding: 12px 16px;
      font-size: 12px;
      color: #2C3E50;
      box-shadow: 0 2px 8px rgba(44, 62, 80, 0.08);
    }
    .demo-helper-title {
      font-weight: 800;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #757575;
      margin-bottom: 8px;
    }
    .demo-btn-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .demo-btn {
      flex: 1;
      min-width: 110px;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid #2C3E50;
      background: #F8FAFC;
      color: #2C3E50;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
    }
    .demo-btn:hover { background: #2C3E50; color: #FFFFFF; }
    .demo-btn.primary { background: #2C3E50; color: #FFFFFF; }
    .demo-btn.primary:hover { background: #1A252F; }
    .demo-btn.reset { flex: 0 0 auto; min-width: auto; border-color: #CBD5E1; color: #757575; font-weight: 600; }
    .demo-btn.reset:hover { background: #E2E8F0; color: #2C3E50; }
  </style>
</head>
<body>
<main id="login">
  <section class="demo-hero" aria-label="Demo environment notice">
    <div class="demo-hero-tag">INTERACTIVE PREVIEW</div>
    <h2 class="demo-hero-title">THIS IS A DEMO</h2>
    <p class="demo-hero-sub">Sample UI preview only — not the original live project.</p>
  </section>

  <form class="card" id="loginForm" autocomplete="off" novalidate>
    <div class="brand-wrap">
      <div class="brand">SNEHA MITRA</div>
      <div class="brand-demo-pill">DEMO MODE</div>
    </div>
    <h1>Login</h1>
    <p>Enter your credentials to sign in.</p>

    <label for="user_id">User ID</label>
    <input type="text" id="user_id" name="user_id" autocomplete="username" aria-describedby="e_user_id">
    <div class="field-err" id="e_user_id" role="alert"></div>

    <label for="password">Password</label>
    <input type="password" id="password" name="password" autocomplete="current-password" aria-describedby="e_password">
    <div class="field-err" id="e_password" role="alert"></div>

    <button class="go" type="submit">Login</button>
  </form>

  <div class="demo-helper" aria-label="Demo Quick Access">
    <div class="demo-helper-title">Interactive Demo Access (No Backend Required)</div>
    <div class="demo-btn-row">
      <button type="button" class="demo-btn primary" id="demoAdminBtn">Open Admin View</button>
      <button type="button" class="demo-btn" id="demoUserBtn">Open Caregiver View</button>
      <button type="button" class="demo-btn reset" id="demoResetBtn" title="Restore initial sample data">Reset</button>
    </div>
  </div>
</main>

<script src="static/js/mock_backend.js"></script>
<script src="static/js/validation.js"></script>
<script src="static/js/login.js"></script>
<script>
  (function () {
    const form = document.getElementById('loginForm');
    const uidEl = document.getElementById('user_id');
    const pwEl = document.getElementById('password');
    const errUid = document.getElementById('e_user_id');

    form.addEventListener('submit', function (event) {
      if (event.defaultPrevented) return;
      event.preventDefault();
      const res = window.SM_DEMO.authenticateDemoUser(uidEl.value);
      if (!res.ok) {
        FormCheck.setState(uidEl, errUid, res.error || 'Enter a valid User ID');
        FormCheck.focus(uidEl);
        return;
      }
      window.location.href = (res.role === 'ADMIN') ? 'admin.html' : 'caregiver.html';
    });

    document.getElementById('demoAdminBtn').addEventListener('click', function () {
      uidEl.value = 'admin';
      pwEl.value = 'Admin@123';
      window.SM_DEMO.setActiveUserId('admin');
      window.location.href = 'admin.html';
    });

    document.getElementById('demoUserBtn').addEventListener('click', function () {
      uidEl.value = 'gda01';
      pwEl.value = 'Care@1234';
      window.SM_DEMO.setActiveUserId('gda01');
      window.location.href = 'caregiver.html';
    });

    document.getElementById('demoResetBtn').addEventListener('click', function () {
      window.SM_DEMO.resetDemoData();
      this.textContent = 'Reset ✓';
      setTimeout(() => { this.textContent = 'Reset'; }, 1200);
    });
  })();
</script>
</body>
</html>
